name: Build VEXORIUM Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/main.yml'
      - 'src/**'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build standalone launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish .\src\VexoriumLauncher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\PLAYER_BUILD

          if (!(Test-Path .\PLAYER_BUILD\VexoriumLauncher.exe)) {
            throw 'VexoriumLauncher.exe was not created.'
          }

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: VexoriumLauncher-Windows-x64
          path: PLAYER_BUILD/VexoriumLauncher.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish launcher release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: launcher-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "VEXORIUM Launcher #${{ github.run_number }}"
          body: |
            Автоматическая сборка лаунчера VEXORIUM ROLEPLAY для Windows x64.
            Саму GTA San Andreas в релиз не включает.
          files: PLAYER_BUILD/VexoriumLauncher.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
