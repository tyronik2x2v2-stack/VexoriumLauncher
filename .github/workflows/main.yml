                      ForeColor = Muted,
                      BackColor = BackgroundColor,
                      Font = new Font("Segoe UI", 9F, FontStyle.Bold)
                  };

                  _nicknameBox = new TextBox
                  {
                      Location = new Point(120, 8),
                      Width = 300,
                      Height = 28,
                      MaxLength = 20,
