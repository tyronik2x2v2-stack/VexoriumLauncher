                  nicknamePanel.Controls.Add(nicknameLabel);
                  nicknamePanel.Controls.Add(_nicknameBox);
                  nicknamePanel.Resize += (_, _) =>
                      _nicknameBox.Width = Math.Max(100, nicknamePanel.ClientSize.Width - 130);

                  var buttons = new FlowLayoutPanel
