
name: Build VEXORIUM Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/main.yml'
      - 'src/**'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create and publish launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .\src\Assets | Out-Null

          $photos = @(
            @{ Name = 'police.jpg'; Url = 'https://images.unsplash.com/photo-1693745200286-3b636b5f3bd6?auto=format&fit=crop&fm=jpg&h=600&ixlib=rb-4.1.0&q=78&w=1200' },
            @{ Name = 'fbi.jpg'; Url = 'https://images.unsplash.com/photo-1644911608651-dacd9169b9a1?auto=format&fit=crop&fm=jpg&h=600&ixlib=rb-4.1.0&q=78&w=1200' },
            @{ Name = 'autotheft.jpg'; Url = 'https://images.unsplash.com/photo-1604705528621-81b2755a320b?auto=format&fit=crop&fm=jpg&h=600&ixlib=rb-4.1.0&q=78&w=1200' }
          )

          foreach ($photo in $photos) {
            $destination = Join-Path '.\src\Assets' $photo.Name
            Invoke-WebRequest -Uri $photo.Url -OutFile $destination -Headers @{ 'User-Agent' = 'Mozilla/5.0 VexoriumLauncherBuild' } -TimeoutSec 60
            if (!(Test-Path $destination) -or (Get-Item $destination).Length -lt 10000) {
              throw "Photo download failed or is too small: $($photo.Name)"
            }
          }

          $projectContent = @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <AssemblyName>VexoriumLauncher</AssemblyName>
              <RootNamespace>VexoriumLauncher</RootNamespace>
            </PropertyGroup>
            <ItemGroup>
              <EmbeddedResource Include="Assets\police.jpg" LogicalName="VexoriumLauncher.Assets.police.jpg" />
              <EmbeddedResource Include="Assets\fbi.jpg" LogicalName="VexoriumLauncher.Assets.fbi.jpg" />
              <EmbeddedResource Include="Assets\autotheft.jpg" LogicalName="VexoriumLauncher.Assets.autotheft.jpg" />
            </ItemGroup>
          </Project>
          '@
          Set-Content -Encoding utf8 -Path .\src\VexoriumLauncher.csproj -Value $projectContent

          $sourceContent = @'
          using System;
          using System.Diagnostics;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.IO;
          using System.Reflection;
          using System.Drawing.Imaging;
          using System.Net.Http;
          using System.Windows.Forms;
          using Microsoft.Win32;

          namespace VexoriumLauncher;

          internal static class Program
          {
              [STAThread]
              private static void Main()
              {
                  ApplicationConfiguration.Initialize();
                  string? gamePath = GameInstall.FindSavedPath();

                  if (string.IsNullOrWhiteSpace(gamePath))
                  {
                      DialogResult answer = MessageBox.Show(
                          "У вас уже есть совместимая PC-версия GTA San Andreas?\n\nДа — выберите папку игры.\nНет — сначала установите свою законно приобретённую копию игры, затем запустите лаунчер снова.",
                          "VEXORIUM ROLEPLAY — первый запуск",
                          MessageBoxButtons.YesNo,
                          MessageBoxIcon.Question);

                      if (answer == DialogResult.Yes)
                      {
                          gamePath = GameInstall.PickGameFolder();
                          if (!string.IsNullOrWhiteSpace(gamePath))
                              GameInstall.PromptForSampIfMissing(gamePath, null);
                      }
                  }

                  Application.Run(new LauncherForm(gamePath));
              }
          }

          internal static class GameInstall
          {
              private const string SampInstallerUrl = "https://gta-multiplayer.cz/downloads/sa-mp-0.3.7-R5-2-MP-install.exe";

              private static readonly string ConfigDirectory = Path.Combine(
                  Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "Vexorium");

              private static readonly string ConfigFile = Path.Combine(ConfigDirectory, "game-path.txt");

              public static string AvatarPath => Path.Combine(ConfigDirectory, "avatar.png");

              public static string GetSavedNickname()
              {
                  try
                  {
                      string? nickname = Registry.GetValue(
                          @"HKEY_CURRENT_USER\SOFTWARE\SAMP",
                          "PlayerName",
                          null) as string;

                      if (IsValidNickname(nickname))
                          return nickname!;
                  }
                  catch { }

                  return "Player_Name";
              }

              public static bool IsValidNickname(string? nickname)
              {
                  if (string.IsNullOrWhiteSpace(nickname) ||
                      nickname.Length < 3 || nickname.Length > 20)
                      return false;

                  const string allowed = "[]()$@._=";

                  foreach (char c in nickname)
                  {
                      if (!char.IsAsciiLetterOrDigit(c) && !allowed.Contains(c))
                          return false;
                  }

                  return true;
              }

              public static void SaveNickname(string nickname)
              {
                  Registry.SetValue(
                      @"HKEY_CURRENT_USER\SOFTWARE\SAMP",
                      "PlayerName",
                      nickname,
                      RegistryValueKind.String);
              }

              public static string? FindSavedPath()
              {
                  try
                  {
                      if (File.Exists(ConfigFile))
                      {
                          string path = File.ReadAllText(ConfigFile).Trim();
                          if (IsGameFolder(path)) return path;
                      }
                  }
                  catch { }

                  return null;
              }

              public static bool IsGameFolder(string? path) =>
                  !string.IsNullOrWhiteSpace(path) && File.Exists(Path.Combine(path, "gta_sa.exe"));

              public static bool HasSamp(string? gamePath) =>
                  IsGameFolder(gamePath) && File.Exists(Path.Combine(gamePath!, "samp.exe"));

              public static string? PickGameFolder()
              {
                  using var dialog = new FolderBrowserDialog
                  {
                      Description = "Выберите папку, в которой находится gta_sa.exe",
                      UseDescriptionForTitle = true,
                      ShowNewFolderButton = false
                  };

                  if (dialog.ShowDialog() != DialogResult.OK) return null;

                  if (!IsGameFolder(dialog.SelectedPath))
                  {
                      MessageBox.Show(
                          "В выбранной папке не найден gta_sa.exe. Выберите именно папку GTA San Andreas.",
                          "Папка игры не найдена",
                          MessageBoxButtons.OK,
                          MessageBoxIcon.Warning);
                      return null;
                  }

                  try
                  {
                      Directory.CreateDirectory(ConfigDirectory);
                      File.WriteAllText(ConfigFile, dialog.SelectedPath);
                  }
                  catch { }

                  return dialog.SelectedPath;
              }

              public static async void PromptForSampIfMissing(string? gamePath, IWin32Window? owner)
              {
                  if (!IsGameFolder(gamePath) || HasSamp(gamePath)) return;

                  DialogResult choice = MessageBox.Show(
                      owner,
                      "GTA San Andreas найдена, но SA-MP ещё не установлен.\n\n" +
                      "Нажми «Да», чтобы скачать установщик SA-MP. После загрузки проверь источник и запусти установщик самостоятельно, если доверяешь ему.\n\n" +
                      "В установщике выбери папку, где находится gta_sa.exe.",
                      "Установить SA-MP",
                      MessageBoxButtons.YesNo,
                      MessageBoxIcon.Information);

                  if (choice != DialogResult.Yes) return;

                  string downloadPath = Path.Combine(
                      ConfigDirectory, "downloads", "sa-mp-0.3.7-R5-2-MP-install.exe");

                  try
                  {
                      Directory.CreateDirectory(Path.GetDirectoryName(downloadPath)!);

                      using var client = new HttpClient();
                      client.Timeout = TimeSpan.FromMinutes(3);

                      using HttpResponseMessage response = await client.GetAsync(
                          SampInstallerUrl, HttpCompletionOption.ResponseHeadersRead);
                      response.EnsureSuccessStatusCode();

                      await using (Stream remote = await response.Content.ReadAsStreamAsync())
                      await using (var local = new FileStream(
                          downloadPath, FileMode.Create, FileAccess.Write, FileShare.None))
                      {
                          await remote.CopyToAsync(local);
                      }

                      if (new FileInfo(downloadPath).Length < 5_000_000)
                          throw new InvalidDataException("Установщик слишком маленький; файл удалён.");

                      MessageBox.Show(
                          owner,
                          "Установщик загружен:\n" + downloadPath +
                          "\n\nПроверь файл перед запуском. После установки SA-MP вернись в лаунчер.",
                          "SA-MP загружен",
                          MessageBoxButtons.OK,
                          MessageBoxIcon.Information);
                  }
                  catch (Exception ex)
                  {
                      try { if (File.Exists(downloadPath)) File.Delete(downloadPath); } catch { }

                      MessageBox.Show(
                          owner,
                          "Не удалось скачать установщик SA-MP.\n\n" + ex.Message,
                          "Ошибка загрузки",
                          MessageBoxButtons.OK,
                          MessageBoxIcon.Error);
                  }
              }
          }

          internal static class LauncherImages
          {
              public static Image? Load(string resourceName)
              {
                  try
                  {
                      using Stream? stream = Assembly.GetExecutingAssembly()
                          .GetManifestResourceStream(resourceName);

                      if (stream is null) return null;

                      using var original = new Bitmap(stream);
                      return new Bitmap(original);
                  }
                  catch { return null; }
              }

              public static Image? LoadFile(string path)
              {
                  try
                  {
                      if (!File.Exists(path)) return null;

                      using var stream = new FileStream(
                          path, FileMode.Open, FileAccess.Read, FileShare.ReadWrite);

                      using var original = new Bitmap(stream);
                      return new Bitmap(original);
                  }
                  catch { return null; }
              }
          }

          internal sealed class CoverPictureBox : PictureBox
          {
              public CoverPictureBox()
              {
                  DoubleBuffered = true;
                  SizeMode = PictureBoxSizeMode.Normal;
              }

              protected override void OnPaint(PaintEventArgs e)
              {
                  e.Graphics.Clear(BackColor);
                  if (Image is null || ClientSize.Width <= 0 || ClientSize.Height <= 0) return;

                  float sourceAspect = (float)Image.Width / Image.Height;
                  float targetAspect = (float)ClientSize.Width / ClientSize.Height;
                  Rectangle source;

                  if (sourceAspect > targetAspect)
                  {
                      int cropWidth = Math.Max(1, (int)(Image.Height * targetAspect));
                      source = new Rectangle((Image.Width - cropWidth) / 2, 0, cropWidth, Image.Height);
                  }
                  else
                  {
                      int cropHeight = Math.Max(1, (int)(Image.Width / targetAspect));
                      source = new Rectangle(0, (Image.Height - cropHeight) / 2, Image.Width, cropHeight);
                  }

                  e.Graphics.InterpolationMode = InterpolationMode.HighQualityBicubic;
                  e.Graphics.PixelOffsetMode = PixelOffsetMode.HighQuality;
                  e.Graphics.DrawImage(
                      Image,
                      new Rectangle(0, 0, ClientSize.Width, ClientSize.Height),
                      source,
                      GraphicsUnit.Pixel);
              }
          }

          internal sealed class AvatarPictureBox : Control
          {
              public Image? AvatarImage { get; set; }

              public AvatarPictureBox()
              {
                  SetStyle(
                      ControlStyles.AllPaintingInWmPaint |
                      ControlStyles.UserPaint |
                      ControlStyles.OptimizedDoubleBuffer |
                      ControlStyles.ResizeRedraw,
                      true);

                  Size = new Size(54, 54);
                  Cursor = Cursors.Hand;
                  BackColor = Color.FromArgb(30, 31, 40);
              }

              protected override void OnPaint(PaintEventArgs e)
              {
                  base.OnPaint(e);
                  Graphics g = e.Graphics;
                  g.SmoothingMode = SmoothingMode.AntiAlias;

                  var circle = new Rectangle(2, 2, Math.Max(1, Width - 5), Math.Max(1, Height - 5));

                  using var clip = new GraphicsPath();
                  clip.AddEllipse(circle);
                  g.SetClip(clip);

                  using (var gradient = new LinearGradientBrush(
                      circle, Color.FromArgb(225, 39, 54), Color.FromArgb(80, 28, 47), 45f))
                  {
                      g.FillEllipse(gradient, circle);
                  }

                  if (AvatarImage != null)
                  {
                      float aspect = (float)AvatarImage.Width / Math.Max(1, AvatarImage.Height);
                      Rectangle src;

                      if (aspect > 1f)
                      {
                          int w = Math.Max(1, (int)AvatarImage.Height);
                          src = new Rectangle((AvatarImage.Width - w) / 2, 0, w, AvatarImage.Height);
                      }
                      else
                      {
                          int h = Math.Max(1, (int)AvatarImage.Width);
                          src = new Rectangle(0, (AvatarImage.Height - h) / 2, AvatarImage.Width, h);
                      }

                      g.DrawImage(AvatarImage, circle, src, GraphicsUnit.Pixel);
                  }
                  else
                  {
                      using var headBrush = new SolidBrush(Color.FromArgb(240, 243, 248));
                      using var bodyBrush = new SolidBrush(Color.FromArgb(210, 216, 226));
                      int headSize = Math.Max(10, Width / 4);

                      g.FillEllipse(headBrush, Width / 2 - headSize / 2, Height / 4, headSize, headSize);
                      g.FillEllipse(bodyBrush, new Rectangle(Width / 4, Height / 2 + 5, Width / 2, Height / 2));
                  }

                  g.ResetClip();
                  using var border = new Pen(Color.FromArgb(245, 225, 39, 54), 2.2f);
                  g.DrawEllipse(border, circle);
              }
          }

