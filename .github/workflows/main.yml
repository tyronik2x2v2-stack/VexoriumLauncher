              private static Control NewsCard(string title, string description, string imageResource, int index)
              {
                  var panel = new Panel
                  {
                      Dock = DockStyle.Fill,
                      BackColor = PanelColor,
                      Margin = new Padding(0, 0, index == 2 ? 0 : 12, 0),
                      Padding = Padding.Empty
                  };

                  var photo = new CoverPictureBox
                  {
                      Dock = DockStyle.Top,
                      Height = 120,
                      BackColor = Color.FromArgb(39, 40, 49),
                      Image = LauncherImages.Load(imageResource),
                      Margin = Padding.Empty
                  };

                  var heading = new Label
                  {
                      Dock = DockStyle.Top,
                      Height = 27,
                      Text = title,
                      Font = new Font("Segoe UI", 10.5F, FontStyle.Bold),
                      ForeColor = White,
                      BackColor = PanelColor,
                      Padding = new Padding(10, 3, 6, 0),
                      AutoEllipsis = true,
                      Margin = Padding.Empty
                  };

                  var desc = new Label
                  {
                      Dock = DockStyle.Fill,
                      Text = description,
                      ForeColor = Muted,
                      BackColor = PanelColor,
                      Font = new Font("Segoe UI", 8.1F),
                      Padding = new Padding(10, 2, 7, 4),
                      AutoEllipsis = true,
                      Margin = Padding.Empty
                  };

                  panel.Controls.Add(desc);
                  panel.Controls.Add(heading);
                  panel.Controls.Add(photo);
                  return panel;
              }

              private void ResizeMainLayout()
              {
                  if (_contentPanel.IsDisposed) return;

                  int scrollWidth = _contentPanel.VerticalScroll.Visible
                      ? SystemInformation.VerticalScrollBarWidth : 0;

                  _mainLayout.Width = Math.Max(
                      300,
                      _contentPanel.ClientSize.Width -
                      _contentPanel.Padding.Horizontal -
                      scrollWidth);
              }

              private Button MakeButton(string text, Color back, Color fore, int width)
              {
                  var button = new Button
                  {
                      Text = text,
                      Width = width,
                      Height = 43,
                      FlatStyle = FlatStyle.Flat,
                      UseVisualStyleBackColor = false,
                      BackColor = back,
                      ForeColor = fore,
                      Font = new Font("Segoe UI", 9F, FontStyle.Bold),
                      Margin = new Padding(0, 0, 12, 8),
                      Cursor = Cursors.Hand,
                      TextAlign = ContentAlignment.MiddleCenter
                  };

                  button.FlatAppearance.BorderColor = Color.FromArgb(61, 62, 73);
                  button.FlatAppearance.BorderSize = 1;
                  button.FlatAppearance.MouseOverBackColor = Color.FromArgb(45, 46, 56);

                  if (back == Red)
                  {
                      button.FlatAppearance.BorderSize = 0;
                      button.FlatAppearance.MouseOverBackColor = Color.FromArgb(245, 48, 63);
                  }

                  return button;
              }

              private void ChangeAvatar()
              {
                  using var dialog = new OpenFileDialog
                  {
                      Title = "Выбери аватар VEXORIUM",
                      Filter = "Изображения (*.png;*.jpg;*.jpeg;*.bmp)|*.png;*.jpg;*.jpeg;*.bmp",
                      CheckFileExists = true,
                      Multiselect = false
                  };

                  if (dialog.ShowDialog(this) != DialogResult.OK) return;

                  try
                  {
                      using var source = Image.FromFile(dialog.FileName);
                      using var bitmap = new Bitmap(source);

                      Directory.CreateDirectory(Path.GetDirectoryName(GameInstall.AvatarPath)!);
                      bitmap.Save(GameInstall.AvatarPath, ImageFormat.Png);

                      Image? newAvatar = LauncherImages.LoadFile(GameInstall.AvatarPath);
                      if (newAvatar is null)
                          throw new InvalidDataException("Не удалось открыть выбранное изображение.");

                      Image? oldAvatar = _avatar.AvatarImage;
                      _avatar.AvatarImage = newAvatar;
                      _avatar.Invalidate();
                      oldAvatar?.Dispose();
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show(
                          this,
                          "Не удалось установить аватар:\n" + ex.Message,
                          "Аватар VEXORIUM",
                          MessageBoxButtons.OK,
                          MessageBoxIcon.Error);
                  }
              }

              private string StatusText()
              {
                  if (!GameInstall.IsGameFolder(_gamePath))
                      return "Папка GTA San Andreas не выбрана. Нажми «Выбрать папку GTA».";
                  if (!GameInstall.HasSamp(_gamePath))
                      return "GTA найдена, но SA-MP не установлен. Нажми «Играть» для инструкции по установке.";
                  return "GTA San Andreas и SA-MP найдены. Можно подключаться к серверу.";
              }

              private void RefreshStatus()
              {
                  _gameStatus.Text = StatusText();
                  _playButton.Enabled = GameInstall.IsGameFolder(_gamePath);
                  _playButton.BackColor = _playButton.Enabled ? Red : Color.FromArgb(88, 34, 41);
              }

              private void ChooseGameFolder()
              {
                  string? selected = GameInstall.PickGameFolder();
                  if (string.IsNullOrWhiteSpace(selected)) return;

                  _gamePath = selected;
                  RefreshStatus();
                  GameInstall.PromptForSampIfMissing(_gamePath, this);
                  RefreshStatus();
              }

              private void LaunchGame()
              {
                  string nickname = _nicknameBox.Text.Trim();

                  if (!GameInstall.IsValidNickname(nickname))
                  {
                      MessageBox.Show(
                          this,
                          "Введи никнейм длиной от 3 до 20 символов. Разрешены латинские буквы, цифры и []()$@._=.",
                          "Проверь никнейм",
                          MessageBoxButtons.OK,
                          MessageBoxIcon.Warning);

                      _nicknameBox.Focus();
                      return;
                  }

                  try
                  {
                      GameInstall.SaveNickname(nickname);
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show(
                          this,
                          "Не удалось сохранить никнейм:\n" + ex.Message,
                          "Ошибка настроек",
                          MessageBoxButtons.OK,
                          MessageBoxIcon.Error);
                      return;
                  }

                  if (!GameInstall.IsGameFolder(_gamePath))
                  {
                      MessageBox.Show(
                          this,
                          "Сначала выбери папку, где находится gta_sa.exe.",
                          "GTA San Andreas",
                          MessageBoxButtons.OK,
                          MessageBoxIcon.Warning);
                      RefreshStatus();
                      return;
                  }

                  if (!GameInstall.HasSamp(_gamePath))
                  {
                      GameInstall.PromptForSampIfMissing(_gamePath, this);
                      RefreshStatus();
                      return;
                  }

                  string sampPath = Path.Combine(_gamePath!, "samp.exe");

                  try
                  {
                      Process.Start(new ProcessStartInfo
                      {
                          FileName = sampPath,
                          Arguments = ServerAddress,
                          WorkingDirectory = _gamePath!,
                          UseShellExecute = true
                      });
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show(
                          this,
                          "Не удалось запустить SA-MP:\n" + ex.Message,
                          "Ошибка запуска",
                          MessageBoxButtons.OK,
                          MessageBoxIcon.Error);
                  }
              }
          }
          '@

          Set-Content -Encoding utf8 -Path .\src\Program.cs -Value $sourceContent

          $credits = @'
          VEXORIUM ROLEPLAY — image credits
          Images are retrieved from Unsplash at build time and embedded in the application.
          '@
          Set-Content -Encoding utf8 -Path .\src\Assets\PHOTO_CREDITS.txt -Value $credits

          dotnet publish .\src\VexoriumLauncher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\PLAYER_BUILD

          if (!(Test-Path .\PLAYER_BUILD\VexoriumLauncher.exe)) {
            throw 'VexoriumLauncher.exe was not created.'
          }

          Write-Host 'VEXORIUM launcher build completed.'

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: VexoriumLauncher-Windows-x64
          path: PLAYER_BUILD/VexoriumLauncher.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish launcher to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: launcher-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "VEXORIUM Launcher #${{ github.run_number }}"
          body: |
            Автоматическая сборка VEXORIUM ROLEPLAY Launcher для Windows x64.
            Файл: VexoriumLauncher.exe
          files: PLAYER_BUILD/VexoriumLauncher.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
