name: Build VEXORIUM Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create and publish launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\src | Out-Null
          $projectContent = @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <AssemblyName>VexoriumLauncher</AssemblyName>
              <RootNamespace>VexoriumLauncher</RootNamespace>
            </PropertyGroup>
          </Project>
          '@
          Set-Content -Encoding utf8 -Path .\src\VexoriumLauncher.csproj -Value $projectContent

          $sourceContent = @'
          using System.Diagnostics;
          using System.Drawing;
          using System.IO;
          using System.Windows.Forms;

          namespace VexoriumLauncher;

          internal static class Program
          {
              [STAThread]
              private static void Main()
              {
                  ApplicationConfiguration.Initialize();
                  string? gamePath = GameInstall.FindSavedPath();
                  if (string.IsNullOrWhiteSpace(gamePath))
                  {
                      DialogResult answer = MessageBox.Show(
                          "У вас уже есть совместимая PC-версия GTA San Andreas?\n\nНажмите «Да», чтобы выбрать папку игры. Если игры нет, установите законно приобретённую копию и запустите лаунчер снова.",
                          "VEXORIUM ROLEPLAY — первый запуск",
                          MessageBoxButtons.YesNo,
                          MessageBoxIcon.Question);
                      if (answer == DialogResult.Yes)
                          gamePath = GameInstall.PickGameFolder();
                  }
                  Application.Run(new LauncherForm(gamePath));
              }
          }

          internal static class GameInstall
          {
              private static readonly string ConfigDirectory = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "Vexorium");
              private static readonly string ConfigFile = Path.Combine(ConfigDirectory, "game-path.txt");

              public static string? FindSavedPath()
              {
                  try
                  {
                      if (File.Exists(ConfigFile))
                      {
                          string path = File.ReadAllText(ConfigFile).Trim();
                          if (IsGameFolder(path)) return path;
                      }
                  }
                  catch { }
                  return null;
              }

              public static bool IsGameFolder(string? path) => !string.IsNullOrWhiteSpace(path) && File.Exists(Path.Combine(path, "gta_sa.exe"));

              public static string? PickGameFolder()
              {
                  using var dialog = new FolderBrowserDialog
                  {
                      Description = "Выберите папку, в которой находится gta_sa.exe",
                      UseDescriptionForTitle = true,
                      ShowNewFolderButton = false
                  };
                  if (dialog.ShowDialog() != DialogResult.OK) return null;
                  if (!IsGameFolder(dialog.SelectedPath))
                  {
                      MessageBox.Show("В выбранной папке не найден gta_sa.exe. Выберите именно папку GTA San Andreas.", "Папка не найдена", MessageBoxButtons.OK, MessageBoxIcon.Warning);
                      return null;
                  }
                  try
                  {
                      Directory.CreateDirectory(ConfigDirectory);
                      File.WriteAllText(ConfigFile, dialog.SelectedPath);
                  }
                  catch { }
                  return dialog.SelectedPath;
              }
          }

          internal sealed class LauncherForm : Form
          {
              private const string ServerAddress = "ams-game-02.centnodes.net:40065";
              private string? _gamePath;
              private readonly Label _gameStatus;
              private readonly Button _launchButton;

              private static readonly Color BackgroundColor = Color.FromArgb(16, 17, 22);
              private static readonly Color PanelColor = Color.FromArgb(27, 28, 35);
              private static readonly Color Red = Color.FromArgb(225, 39, 54);
              private static readonly Color White = Color.FromArgb(245, 245, 248);
              private static readonly Color Muted = Color.FromArgb(165, 167, 178);

              public LauncherForm(string? gamePath)
              {
                  _gamePath = GameInstall.IsGameFolder(gamePath) ? gamePath : null;
                  Text = "VEXORIUM ROLEPLAY";
                  StartPosition = FormStartPosition.CenterScreen;
                  MinimumSize = new Size(850, 590);
                  Size = new Size(1040, 700);
                  BackColor = BackgroundColor;
                  ForeColor = White;
                  Font = new Font("Segoe UI", 10F);

                  var header = new Panel { Dock = DockStyle.Top, Height = 92, BackColor = Color.FromArgb(22, 23, 29), Padding = new Padding(28, 12, 24, 12) };
                  Controls.Add(header);
                  var brand = new Label { AutoSize = true, Text = "VEXORIUM", Font = new Font("Segoe UI", 25F, FontStyle.Bold), ForeColor = Red, Location = new Point(25, 12) };
                  var rolePlay = new Label { AutoSize = true, Text = "ROLEPLAY", Font = new Font("Segoe UI", 11F, FontStyle.Bold), ForeColor = White, Location = new Point(29, 56) };
                  var server = new Label { AutoSize = true, Text = "СЕРВЕР 01  •  VEXORIUM ROLEPLAY", ForeColor = Muted, Font = new Font("Segoe UI", 10F, FontStyle.Bold), Anchor = AnchorStyles.Top | AnchorStyles.Right };
                  header.Controls.Add(brand); header.Controls.Add(rolePlay); header.Controls.Add(server);
                  header.Resize += (_, _) => server.Location = new Point(Math.Max(430, header.ClientSize.Width - server.Width - 24), 36);
                  server.Location = new Point(700, 36);

                  var content = new Panel { Dock = DockStyle.Fill, Padding = new Padding(28, 23, 28, 25), BackColor = BackgroundColor, AutoScroll = true };
                  Controls.Add(content);
                  content.BringToFront();
                  header.BringToFront();

                  var welcome = new Label { Dock = DockStyle.Top, Height = 45, Text = "ТВОЯ ИСТОРИЯ НАЧИНАЕТСЯ ЗДЕСЬ", Font = new Font("Segoe UI", 18F, FontStyle.Bold), ForeColor = White, TextAlign = ContentAlignment.MiddleLeft };
                  content.Controls.Add(welcome);
                  var subtitle = new Label { Dock = DockStyle.Top, Height = 32, Text = "Подготовь игру и присоединяйся к VEXORIUM ROLEPLAY", ForeColor = Muted, TextAlign = ContentAlignment.MiddleLeft };
                  content.Controls.Add(subtitle);

                  var newsTitle = new Label { Dock = DockStyle.Top, Height = 44, Padding = new Padding(0, 13, 0, 0), Text = "ПОСЛЕДНИЕ ОБНОВЛЕНИЯ", Font = new Font("Segoe UI", 10F, FontStyle.Bold), ForeColor = White };
                  content.Controls.Add(newsTitle);

                  var cards = new TableLayoutPanel { Dock = DockStyle.Top, Height = 150, ColumnCount = 3, RowCount = 1, BackColor = BackgroundColor, Margin = new Padding(0), Padding = new Padding(0) };
                  cards.ColumnStyles.Add(new ColumnStyle(SizeType.Percent, 33.333F));
                  cards.ColumnStyles.Add(new ColumnStyle(SizeType.Percent, 33.333F));
                  cards.ColumnStyles.Add(new ColumnStyle(SizeType.Percent, 33.334F));
                  cards.Controls.Add(NewsCard("ПОЛИЦИЯ", "Новые возможности службы", Color.FromArgb(53, 76, 123)), 0, 0);
                  cards.Controls.Add(NewsCard("FBI", "Обновление спецподразделения", Color.FromArgb(83, 48, 77)), 1, 0);
                  cards.Controls.Add(NewsCard("АВТОУГОН", "Новая работа для жителей", Color.FromArgb(121, 58, 38)), 2, 0);
                  content.Controls.Add(cards);

                  var info = new Panel { Dock = DockStyle.Top, Height = 94, BackColor = PanelColor, Padding = new Padding(18, 13, 18, 10) };
                  var infoTitle = new Label { Dock = DockStyle.Top, Height = 25, Text = "ГОТОВНОСТЬ К ИГРЕ", Font = new Font("Segoe UI", 10F, FontStyle.Bold), ForeColor = White };
                  _gameStatus = new Label { Dock = DockStyle.Fill, Text = StatusText(), ForeColor = Muted, TextAlign = ContentAlignment.MiddleLeft };
                  info.Controls.Add(_gameStatus); info.Controls.Add(infoTitle);
                  content.Controls.Add(info);

                  var buttons = new FlowLayoutPanel { Dock = DockStyle.Top, Height = 78, Padding = new Padding(0, 17, 0, 0), BackColor = BackgroundColor, WrapContents = false };
                  _launchButton = MakeButton("▶  ИГРАТЬ", Red, White, 230);
                  _launchButton.Click += (_, _) => LaunchGame();
                  var chooseButton = MakeButton("ВЫБРАТЬ ПАПКУ GTA", PanelColor, White, 220);
                  chooseButton.Click += (_, _) => { _gamePath = GameInstall.PickGameFolder(); RefreshStatus(); };
                  var copyButton = MakeButton("КОПИРОВАТЬ IP", PanelColor, White, 175);
                  copyButton.Click += (_, _) => { Clipboard.SetText(ServerAddress); MessageBox.Show("Адрес сервера скопирован: " + ServerAddress, "VEXORIUM", MessageBoxButtons.OK, MessageBoxIcon.Information); };
                  buttons.Controls.Add(_launchButton); buttons.Controls.Add(chooseButton); buttons.Controls.Add(copyButton);
                  content.Controls.Add(buttons);

                  var footer = new Label { Dock = DockStyle.Top, Height = 40, Text = "VEXORIUM ROLEPLAY  •  " + ServerAddress, ForeColor = Muted, TextAlign = ContentAlignment.MiddleLeft, Font = new Font("Segoe UI", 9F) };
                  content.Controls.Add(footer);
                  RefreshStatus();
              }

              private static Control NewsCard(string title, string description, Color accent)
              {
                  var panel = new Panel { Dock = DockStyle.Fill, BackColor = PanelColor, Margin = new Padding(0, 0, 12, 0), Padding = new Padding(14) };
                  var stripe = new Panel { Dock = DockStyle.Left, Width = 5, BackColor = accent };
                  var heading = new Label { Dock = DockStyle.Top, Height = 32, Text = title, Font = new Font("Segoe UI", 13F, FontStyle.Bold), ForeColor = White, Padding = new Padding(8, 2, 0, 0) };
                  var desc = new Label { Dock = DockStyle.Fill, Text = description, ForeColor = Muted, Padding = new Padding(8, 5, 0, 0) };
                  panel.Controls.Add(desc); panel.Controls.Add(heading); panel.Controls.Add(stripe);
                  return panel;
              }

              private Button MakeButton(string text, Color back, Color fore, int width) => new Button
              {
                  Text = text, Width = width, Height = 44, FlatStyle = FlatStyle.Flat,
                  BackColor = back, ForeColor = fore, Font = new Font("Segoe UI", 9F, FontStyle.Bold),
                  Margin = new Padding(0, 0, 12, 0), Cursor = Cursors.Hand
              };

              private string StatusText() => GameInstall.IsGameFolder(_gamePath)
                  ? "GTA San Andreas найдена. Нажми «Играть», чтобы подключиться к серверу."
                  : "Папка GTA San Andreas не выбрана. Нажми «Выбрать папку GTA».";

              private void RefreshStatus()
              {
                  _gameStatus.Text = StatusText();
                  _launchButton.Enabled = GameInstall.IsGameFolder(_gamePath);
              }

              private void LaunchGame()
              {
                  if (!GameInstall.IsGameFolder(_gamePath))
                  {
                      MessageBox.Show("Сначала выбери папку, где находится gta_sa.exe.", "GTA San Andreas", MessageBoxButtons.OK, MessageBoxIcon.Warning);
                      RefreshStatus();
                      return;
                  }
                  string sampPath = Path.Combine(_gamePath!, "samp.exe");
                  if (!File.Exists(sampPath))
                  {
                      MessageBox.Show("В папке игры не найден samp.exe. Установи совместимый клиент SA-MP отдельно, затем попробуй снова. Лаунчер не скачивает оригинальные файлы GTA.", "Не найден SA-MP", MessageBoxButtons.OK, MessageBoxIcon.Information);
                      return;
                  }
                  try
                  {
                      Process.Start(new ProcessStartInfo
                      {
                          FileName = sampPath,
                          Arguments = ServerAddress,
                          WorkingDirectory = _gamePath!,
                          UseShellExecute = true
                      });
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show("Не удалось запустить SA-MP:\n" + ex.Message, "Ошибка запуска", MessageBoxButtons.OK, MessageBoxIcon.Error);
                  }
              }
          }
          '@
          Set-Content -Encoding utf8 -Path .\src\Program.cs -Value $sourceContent

          dotnet publish .\src\VexoriumLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\PLAYER_BUILD
          if (!(Test-Path .\PLAYER_BUILD\VexoriumLauncher.exe)) { throw 'VexoriumLauncher.exe was not created.' }

      - name: Upload launcher EXE
        uses: actions/upload-artifact@v4
        with:
          name: VexoriumLauncher-Windows-x64
          path: PLAYER_BUILD/VexoriumLauncher.exe
          if-no-files-found: error
          retention-days: 14
