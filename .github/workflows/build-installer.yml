              private static HttpClient CreateHttpClient(TimeSpan timeout)
              {
                  var client = new HttpClient { Timeout = timeout };
                  client.DefaultRequestHeaders.UserAgent.ParseAdd("VEXORIUM-Launcher");
                  return client;
              }

              private async Task CheckUpdatesAsync()
              {
                  if (_checking || _busy) return;
                  _checking = true;
                  _checkSucceeded = false;
                  _updateAvailable = false;
                  _updateButton.Visible = false;
                  _retryButton.Visible = false;
                  _status.ForeColor = Color.FromArgb(235, 190, 93);
                  _status.Text = "Проверяем обновления VEXORIUM…";
                  RefreshButtons();

                  try
                  {
                      using var client = CreateHttpClient(TimeSpan.FromSeconds(20));
                      string json = await client.GetStringAsync(VersionUrl);
                      using var doc = JsonDocument.Parse(json);
                      string remoteText = doc.RootElement.GetProperty("version").GetString() ?? "";
                      if (!Version.TryParse(remoteText, out Version? remote) ||
                          !Version.TryParse(CurrentVersion, out Version? local))
                          throw new Exception("Неверный формат номера версии.");

                      if (remote > local)
                      {
                          _updateAvailable = true;
                          _updateButton.Visible = true;
                          _status.ForeColor = Color.FromArgb(255, 150, 115);
                          _status.Text = $"Доступна версия {remoteText}. Нажми «ОБНОВИТЬ», чтобы продолжить.";
                      }
                      else
                      {
                          _checkSucceeded = true;
                          _status.ForeColor = Color.FromArgb(106, 218, 157);
                          _status.Text = GameInstall.IsManagedGameFolder(_gamePath)
                              ? $"Версия {CurrentVersion} актуальна. Игра и моды VEXORIUM установлены в C:\\VEXORIUM."
                              : $"Версия {CurrentVersion} актуальна. Нажми «УСТАНОВИТЬ VEXORIUM» — лаунчер сам подготовит игру в C:\\VEXORIUM.";
                      }
                  }
                  catch (Exception ex)
                  {
                      _checkSucceeded = false;
                      _updateAvailable = false;
                      _retryButton.Visible = true;
                      _status.ForeColor = Color.FromArgb(255, 145, 145);
                      _status.Text = "Не удалось проверить обновления. Проверь интернет и нажми «ПОВТОРИТЬ ПРОВЕРКУ».";
                      _ = ex;
                  }
                  finally
                  {
                      _checking = false;
                      RefreshButtons();
                  }
              }

              private const string GtaDriveUrl = "https://drive.usercontent.google.com/download?id=1tPOSqb_tT3Cm3x2WEa2Efk3UsbVbA23E&export=download&confirm=t";

              private const string GtaDriveUrl = "https://drive.usercontent.google.com/download?id=1tPOSqb_tT3Cm3x2WEa2Efk3UsbVbA23E&export=download&confirm=t";
              private const string VexoriumModpackManifestUrl = "https://raw.githubusercontent.com/tyronik2x2v2-stack/VexoriumLauncher/main/modpack.json";

              private async Task InstallOrPlayAsync()
              {
                  if (!_checkSucceeded || _checking || _updateAvailable || _busy) return;

                  string nickname = _nickname.Text.Trim();
                  if (nickname.Length < 3 || nickname.Length > 24)
                  {
                      MessageBox.Show("Введи никнейм длиной от 3 до 24 символов.", "Никнейм", MessageBoxButtons.OK, MessageBoxIcon.Warning);
                      _nickname.Focus();
                      return;
                  }

                  _busy = true;
                  RefreshButtons();
                  try
                  {
                      GameInstall.SaveNickname(nickname);
                      await EnsureManagedGameAsync();

                      if (!GameInstall.IsGameFolder(_gamePath))
                          throw new Exception("Не удалось подготовить GTA San Andreas в C:\\VEXORIUM\\Game.");

                      string gameRoot = Path.GetFullPath(_gamePath!);
                      string gtaExe = Path.Combine(gameRoot, "gta_sa.exe");
                      if (!File.Exists(gtaExe))
                          throw new Exception("В установленной папке VEXORIUM не найден gta_sa.exe: " + gameRoot);

                      _status.Text = "Устанавливаем мультиплеерный клиент…";
                      await EnsureSampClientAsync();

                      _status.Text = "Устанавливаем загрузчик модификаций…";
                      await EnsureModLoaderAsync();

                      _status.Text = "Проверяем пакет автомобилей, скинов, аксессуаров и карты VEXORIUM…";
                      await EnsureVexoriumModPackAsync();

                      string sampExe = Path.Combine(gameRoot, "samp.exe");
                      string sampDll = Path.Combine(gameRoot, "samp.dll");
                      if (!File.Exists(sampExe) || new FileInfo(sampExe).Length < 100000)
                          throw new Exception("Не найден рабочий samp.exe рядом с gta_sa.exe. Путь: " + sampExe);
                      if (!IsValidSampClientDll(sampDll))
                          throw new Exception("Не найден рабочий samp.dll рядом с gta_sa.exe. Путь: " + sampDll);

                      _status.Text = "Запускаем SA-MP и подключаемся к VEXORIUM…";
                      var startInfo = new ProcessStartInfo
                      {
                          FileName = sampExe,
                          WorkingDirectory = gameRoot,
                          UseShellExecute = false,
                          CreateNoWindow = false,
                          WindowStyle = ProcessWindowStyle.Normal
                      };
                      startInfo.ArgumentList.Add("-c");
                      startInfo.ArgumentList.Add("-n");
                      startInfo.ArgumentList.Add(nickname);
                      startInfo.ArgumentList.Add("-h");
                      startInfo.ArgumentList.Add(ServerHost);
                      startInfo.ArgumentList.Add("-p");
                      startInfo.ArgumentList.Add(ServerPort);

                      using var sampProcess = Process.Start(startInfo);
                      if (sampProcess == null)
                          throw new Exception("Windows не смог запустить samp.exe.");

                      WriteLaunchLog("SA-MP client started pid=" + sampProcess.Id +
                          ", host=" + ServerHost + ", port=" + ServerPort +
                          ", nickname=" + nickname + ", game=" + gameRoot);
                      _status.ForeColor = Color.FromArgb(106, 218, 157);
                      _status.Text = "VEXORIUM запущен. Игра и клиентские моды подготовлены.";
                  }
                  catch (Exception ex)
                  {
                      _status.ForeColor = Color.FromArgb(255, 145, 145);
                      _status.Text = "Не удалось подготовить или запустить VEXORIUM.";
                      MessageBox.Show("Ошибка VEXORIUM:\\n" + ex.Message, "VEXORIUM", MessageBoxButtons.OK, MessageBoxIcon.Error);
                  }
                  finally
                  {
                      _busy = false;
                      _progress.Visible = false;
                      _progress.Style = ProgressBarStyle.Continuous;
                      RefreshButtons();
                  }
              }

              private async Task EnsureManagedGameAsync()
              {
                  string? managedPath = GameInstall.FindManagedGamePath();
                  if (GameInstall.IsGameFolder(managedPath))
                  {
                      _gamePath = managedPath;
                      GameInstall.SaveGamePath(managedPath!);
                      return;
                  }

                  string? oldGamePath = GameInstall.IsGameFolder(_gamePath)
                      ? _gamePath : GameInstall.FindSavedPath();

                  if (GameInstall.IsGameFolder(oldGamePath))
                  {
                      string source = Path.GetFullPath(oldGamePath!);
                      string managedRoot = GameInstall.ManagedGameDirectory;
                      if (string.Equals(source.TrimEnd('\\', '/'),
                          Path.GetFullPath(managedRoot).TrimEnd('\\', '/'),
                          StringComparison.OrdinalIgnoreCase))
                      {
                          _gamePath = source;
                          GameInstall.SaveGamePath(source);
                          return;
                      }

                      _status.Text = "Копируем существующую GTA в C:\\VEXORIUM\\Game…";
                      _progress.Visible = true;
                      _progress.Style = ProgressBarStyle.Marquee;
                      await InstallManagedGameFromDirectoryAsync(source);
                      _gamePath = GameInstall.FindManagedGamePath();
                      if (!GameInstall.IsGameFolder(_gamePath))
                          throw new Exception("Не удалось перенести существующую GTA в C:\\VEXORIUM\\Game.");
                      GameInstall.SaveGamePath(_gamePath!);
                      WriteLaunchLog("Copied existing GTA installation from " + source +
                          " to " + GameInstall.ManagedGameDirectory);
                      return;
                  }

                  await DownloadAndInstallGtaAsync();
              }

              private async Task InstallManagedGameFromDirectoryAsync(string sourceDirectory)
              {
                  string root = @"C:\VEXORIUM";
                  string stagedGame = Path.Combine(root, "Game.installing");
                  if (Directory.Exists(stagedGame))
                      Directory.Delete(stagedGame, true);
                  Directory.CreateDirectory(stagedGame);

                  await Task.Run(() => CopyDirectoryWithoutOverwrite(sourceDirectory, stagedGame));
                  if (!GameInstall.IsGameFolder(stagedGame))
                  {
                      Directory.Delete(stagedGame, true);
                      throw new Exception("В исходной папке нет gta_sa.exe: " + sourceDirectory);
                  }

                  PromoteManagedGameDirectory(stagedGame);
              }

              private static void PromoteManagedGameDirectory(string stagedGame)
              {
                  string target = GameInstall.ManagedGameDirectory;
                  string? backup = null;
                  if (Directory.Exists(target))
                  {
                      backup = target + ".previous-" + DateTime.Now.ToString("yyyyMMddHHmmss");
                      Directory.Move(target, backup);
                  }

                  try
                  {
                      Directory.Move(stagedGame, target);
                  }
                  catch
                  {
                      if (backup != null && Directory.Exists(backup) && !Directory.Exists(target))
                          Directory.Move(backup, target);
                      throw;
                  }
              }

              private async Task DownloadAndInstallGtaAsync()
              {
                  string tempFile = Path.Combine(Path.GetTempPath(), "Vexorium-GTA-" + Guid.NewGuid().ToString("N") + ".zip");
                  string extractDirectory = Path.Combine(Path.GetTempPath(), "Vexorium-GTA-Extract-" + Guid.NewGuid().ToString("N"));
                  string stagedGame = Path.Combine(@"C:\VEXORIUM", "Game.installing");
                  try
                  {
                      Directory.CreateDirectory(@"C:\VEXORIUM");
                      if (Directory.Exists(stagedGame))
                          Directory.Delete(stagedGame, true);

                      _status.Text = "Скачиваем архив GTA San Andreas…";
                      _progress.Visible = true;
                      _progress.Style = ProgressBarStyle.Marquee;

                      using var client = CreateHttpClient(TimeSpan.FromMinutes(45));
                      using var response = await client.GetAsync(
                          GtaDriveUrl, HttpCompletionOption.ResponseHeadersRead);
                      response.EnsureSuccessStatusCode();

                      await using (var input = await response.Content.ReadAsStreamAsync())
                      await using (var output = new FileStream(tempFile, FileMode.Create, FileAccess.Write, FileShare.None))
                          await input.CopyToAsync(output);

                      var info = new FileInfo(tempFile);
                      if (!info.Exists || info.Length < 5_000_000)
                          throw new Exception("Архив GTA скачан не полностью. Проверь доступ к опубликованному архиву.");

                      byte[] signature = new byte[2];
                      await using (var stream = File.OpenRead(tempFile))
                      {
                          if (await stream.ReadAsync(signature.AsMemory(0, 2)) != 2 ||
                              signature[0] != 0x50 || signature[1] != 0x4B)
                              throw new Exception("По ссылке получен не ZIP-архив GTA. Установка остановлена без изменения существующей игры.");
                      }

                      _status.Text = "Распаковываем GTA во временную папку…";
                      Directory.CreateDirectory(extractDirectory);
                      ZipFile.ExtractToDirectory(tempFile, extractDirectory, true);

                      string? gtaExe = Directory.GetFiles(
                          extractDirectory, "gta_sa.exe", SearchOption.AllDirectories).FirstOrDefault();
                      if (string.IsNullOrWhiteSpace(gtaExe))
                          throw new Exception("В архиве не найден gta_sa.exe.");

                      string sourceGameDirectory = Path.GetDirectoryName(gtaExe)!;
                      Directory.CreateDirectory(stagedGame);
                      await Task.Run(() => CopyDirectoryWithoutOverwrite(sourceGameDirectory, stagedGame));
                      if (!GameInstall.IsGameFolder(stagedGame))
                          throw new Exception("После распаковки в установочной папке не найден gta_sa.exe.");

                      PromoteManagedGameDirectory(stagedGame);
                      _gamePath = GameInstall.FindManagedGamePath();
                      if (!GameInstall.IsGameFolder(_gamePath))
                          throw new Exception("Не удалось завершить установку GTA в C:\\VEXORIUM\\Game.");

                      GameInstall.SaveGamePath(_gamePath!);
                      WriteLaunchLog("Installed GTA archive into " + GameInstall.ManagedGameDirectory);
                      _status.Text = "GTA установлена в C:\\VEXORIUM\\Game. Продолжаем подготовку VEXORIUM…";
                  }
                  finally
                  {
                      try { if (File.Exists(tempFile)) File.Delete(tempFile); } catch { }
                      try { if (Directory.Exists(extractDirectory)) Directory.Delete(extractDirectory, true); } catch { }
                      try { if (Directory.Exists(stagedGame)) Directory.Delete(stagedGame, true); } catch { }
                  }
              }

              private async Task EnsureVexoriumModPackAsync()
              {
                  string gameRoot = _gamePath!;
                  string finalModsDirectory = Path.Combine(gameRoot, "modloader", "VEXORIUM");
                  string[] categories = {
                      "Vehicles", "Skins", "Accessories", "Clothing",
                      "Map", "Buildings", "Textures", "Audio"
                  };
                  Directory.CreateDirectory(finalModsDirectory);
                  foreach (string category in categories)
                      Directory.CreateDirectory(Path.Combine(finalModsDirectory, category));

                  using var client = CreateHttpClient(TimeSpan.FromMinutes(2));
                  string manifestText = await client.GetStringAsync(VexoriumModpackManifestUrl);
                  using var manifest = JsonDocument.Parse(manifestText);
                  JsonElement root = manifest.RootElement;

                  string version = root.TryGetProperty("version", out JsonElement versionElement)
                      ? versionElement.GetString() ?? "" : "";
                  string downloadUrl = root.TryGetProperty("downloadUrl", out JsonElement urlElement)
                      ? urlElement.GetString() ?? "" : "";
                  string expectedSha256 = root.TryGetProperty("sha256", out JsonElement hashElement)
                      ? hashElement.GetString() ?? "" : "";

                  if (string.IsNullOrWhiteSpace(downloadUrl))
                  {
                      WriteLaunchLog("VEXORIUM modpack folders prepared; no downloadable model package is published yet.");
                      _status.Text = "Каталог модов VEXORIUM подготовлен. Проверена версия пакета ресурсов…";
                      return;
                  }

                  if (string.IsNullOrWhiteSpace(version) || expectedSha256.Length != 64 ||
                      expectedSha256.Any(c => !Uri.IsHexDigit(c)))
                      throw new Exception("Файл modpack.json содержит неверную версию или SHA-256 пакета.");

                  string versionFile = Path.Combine(@"C:\VEXORIUM", "modpack-version.txt");
                  string installedVersion = "";
                  try { if (File.Exists(versionFile)) installedVersion = File.ReadAllText(versionFile).Trim(); } catch { }
                  if (string.Equals(installedVersion, version, StringComparison.Ordinal))
                  {
                      WriteLaunchLog("VEXORIUM model package " + version + " is already installed.");
                      return;
                  }

                  if (!Uri.TryCreate(downloadUrl, UriKind.Absolute, out Uri? packageUri) ||
                      packageUri.Scheme != Uri.UriSchemeHttps)
                      throw new Exception("Ссылка на пакет модификаций должна использовать HTTPS.");

                  string zipPath = Path.Combine(Path.GetTempPath(), "Vexorium-Modpack-" + Guid.NewGuid().ToString("N") + ".zip");
                  string extractPath = Path.Combine(Path.GetTempPath(), "Vexorium-Modpack-Extract-" + Guid.NewGuid().ToString("N"));
                  string backupPath = finalModsDirectory + ".previous";
                  try
                  {
                      _status.Text = "Скачиваем пакет модификаций VEXORIUM " + version + "…";
                      using (var response = await client.GetAsync(packageUri, HttpCompletionOption.ResponseHeadersRead))
                      {
                          response.EnsureSuccessStatusCode();
                          await using var input = await response.Content.ReadAsStreamAsync();
                          await using var output = new FileStream(zipPath, FileMode.Create, FileAccess.Write, FileShare.None);
                          await input.CopyToAsync(output);
                      }

                      var packageInfo = new FileInfo(zipPath);
                      if (!packageInfo.Exists || packageInfo.Length < 1000)
                          throw new Exception("Пакет модификаций VEXORIUM пуст или скачан не полностью.");

                      string actualHash;
                      await using (var packageStream = File.OpenRead(zipPath))
                      {
                          byte[] hash = await System.Security.Cryptography.SHA256.HashDataAsync(packageStream);
                          actualHash = Convert.ToHexString(hash);
                      }
                      if (!string.Equals(actualHash, expectedSha256, StringComparison.OrdinalIgnoreCase))
                          throw new Exception("Пакет модификаций VEXORIUM не прошёл проверку SHA-256.");

                      Directory.CreateDirectory(extractPath);
                      ZipFile.ExtractToDirectory(zipPath, extractPath, true);
                      string packageRoot = Directory.Exists(Path.Combine(extractPath, "VEXORIUM"))
                          ? Path.Combine(extractPath, "VEXORIUM") : extractPath;
                      if (!Directory.GetFiles(packageRoot, "*", SearchOption.AllDirectories).Any())
                          throw new Exception("В архиве VEXORIUM нет файлов моделей.");

                      if (Directory.Exists(backupPath))
                          Directory.Delete(backupPath, true);
                      if (Directory.Exists(finalModsDirectory))
                          Directory.Move(finalModsDirectory, backupPath);

                      try
                      {
                          Directory.Move(packageRoot, finalModsDirectory);
                          File.WriteAllText(versionFile, version);
                          if (Directory.Exists(backupPath))
                              Directory.Delete(backupPath, true);
                          WriteLaunchLog("Installed VEXORIUM model package " + version + ".");
                          _status.Text = "Пакет автомобилей, скинов, аксессуаров и карты обновлён до " + version + ".";
                      }
                      catch
                      {
                          if (Directory.Exists(finalModsDirectory))
                              Directory.Delete(finalModsDirectory, true);
                          if (Directory.Exists(backupPath))
                              Directory.Move(backupPath, finalModsDirectory);
                          throw;
                      }
                  }
                  finally
                  {
                      try { if (File.Exists(zipPath)) File.Delete(zipPath); } catch { }
                      try { if (Directory.Exists(extractPath)) Directory.Delete(extractPath, true); } catch { }
                  }
              }

              private static void WriteLaunchLog(string message)
              {
                  try
                  {
                      string directory = Path.Combine(
                          Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "Vexorium");
                      Directory.CreateDirectory(directory);
                      File.AppendAllText(Path.Combine(directory, "launcher.log"),
                          DateTime.Now.ToString("yyyy-MM-dd HH:mm:ss") + " " + message + Environment.NewLine);
                  }
                  catch { }
              }

              private static bool IsValidSampClientDll(string path)
              {
                  try
                  {
                      if (!File.Exists(path) || new FileInfo(path).Length < 100000)
                          return false;

                      using var stream = File.OpenRead(path);
                      byte[] signature = new byte[2];
                      return stream.Read(signature, 0, signature.Length) == 2 &&
                          signature[0] == (byte)'M' && signature[1] == (byte)'Z';
                  }
                  catch
                  {
                      return false;
                  }
              }

              private static async Task<Process?> WaitForNewGameProcessAsync(HashSet<int> previousPids, TimeSpan timeout)
              {
                  var timer = Stopwatch.StartNew();
                  while (timer.Elapsed < timeout)
                  {
                      foreach (Process process in Process.GetProcessesByName("gta_sa"))
                      {
                          try
                          {
                              if (!previousPids.Contains(process.Id))
                                  return process;
                          }
                          catch { }
                      }
                      await Task.Delay(250);
                  }
                  return null;
              }

              private static void StopNewGameProcesses(HashSet<int> previousPids)
              {
                  foreach (Process process in Process.GetProcessesByName("gta_sa"))
                  {
                      try
                      {
                          if (!previousPids.Contains(process.Id))
                          {
                              process.Kill(entireProcessTree: true);
                              process.WaitForExit(3000);
                          }
                      }
                      catch { }
                      finally { process.Dispose(); }
                  }
              }

              private static string ReadOpenMpLauncherLogTail()
              {
                  string path = Path.Combine(OpenMpDirectory, "omp-launcher.log");
                  try
                  {
                      if (!File.Exists(path))
                          return "Файл лога не создан: " + path;
                      string[] lines = File.ReadAllLines(path);
                      return string.Join(Environment.NewLine, lines.TakeLast(25)) +
                          Environment.NewLine + "Полный лог: " + path;
                  }
                  catch (Exception ex)
                  {
                      return "Не удалось прочитать " + path + ": " + ex.Message;
                  }
              }

              private async Task EnsureSampClientAsync()
              {
                  if (!GameInstall.IsGameFolder(_gamePath))
                      throw new Exception("Сначала выбери папку GTA San Andreas.");

                  string gameRoot = Path.GetFullPath(_gamePath!);
                  string sampDllPath = Path.Combine(gameRoot, "samp.dll");

                  if (IsValidSampClientDll(sampDllPath))
                  {
                      WriteLaunchLog("SA-MP client already present: " + sampDllPath);
                      return;
                  }

                  string installerPath = Path.Combine(
                      Path.GetTempPath(),
                      "Vexorium-SA-MP-R5-2-" + Guid.NewGuid().ToString("N") + ".exe");

                  try
                  {
                      _status.Text = "Скачиваем клиент SA-MP 0.3.7 R5-2…";
                      _progress.Visible = true;
                      _progress.Style = ProgressBarStyle.Continuous;
                      _progress.Value = 0;

                      using (var client = CreateHttpClient(TimeSpan.FromMinutes(10)))
                      using (var response = await client.GetAsync(
                          SampClientInstallerUrl, HttpCompletionOption.ResponseHeadersRead))
                      {
                          response.EnsureSuccessStatusCode();
                          long? totalBytes = response.Content.Headers.ContentLength;

                          await using (var input = await response.Content.ReadAsStreamAsync())
                          await using (var output = new FileStream(
                              installerPath, FileMode.CreateNew, FileAccess.Write, FileShare.None))
                          {
                              byte[] buffer = new byte[81920];
                              long downloaded = 0;
                              int read;
                              while ((read = await input.ReadAsync(buffer.AsMemory(0, buffer.Length))) > 0)
                              {
                                  await output.WriteAsync(buffer.AsMemory(0, read));
                                  downloaded += read;

                                  if (totalBytes.HasValue && totalBytes.Value > 0)
                                  {
                                      int percent = (int)Math.Clamp(
                                          downloaded * 100L / totalBytes.Value, 0L, 100L);
                                      _progress.Value = percent;
                                      _status.Text = $"Скачиваем SA-MP 0.3.7 R5-2… {percent}%";
                                  }
                              }
                          }
                      }

                      var installerInfo = new FileInfo(installerPath);
                      if (!installerInfo.Exists || installerInfo.Length < 10000000)
                          throw new Exception("Установщик SA-MP скачан не полностью.");

                      _status.Text = "Проверяем установщик SA-MP…";
                      string actualHash;
                      await using (var hashStream = File.OpenRead(installerPath))
                      {
                          byte[] hash = await System.Security.Cryptography.SHA256.HashDataAsync(hashStream);
                          actualHash = Convert.ToHexString(hash);
                      }

                      if (!string.Equals(
                          actualHash, SampClientInstallerSha256, StringComparison.OrdinalIgnoreCase))
                          throw new Exception("Контрольная сумма установщика SA-MP не совпала. Файл не будет запущен.");

                      _status.Text = "Автоматически устанавливаем SA-MP в папку GTA…";
                      var startInfo = new ProcessStartInfo
                      {
                          FileName = installerPath,
                          WorkingDirectory = Path.GetTempPath(),
                          UseShellExecute = false,
                          CreateNoWindow = true,
                          WindowStyle = ProcessWindowStyle.Hidden
                      };

                      // NSIS /D must be the final argument; it selects the exact folder containing gta_sa.exe.
                      startInfo.ArgumentList.Add("/S");
                      startInfo.ArgumentList.Add("/D=" + gameRoot);

                      using var installerProcess = Process.Start(startInfo);
                      if (installerProcess == null)
                          throw new Exception("Windows не смог запустить установщик SA-MP.");

                      await installerProcess.WaitForExitAsync();
                      int silentInstallerExitCode = installerProcess.ExitCode;

                      // Some NSIS installer builds may return a non-zero code without
                      // placing the multiplayer files. Do not stop here: show the real
                      // setup wizard so the user can select/confirm the GTA folder.
                      if (!IsValidSampClientDll(sampDllPath))
                      {
                          WriteLaunchLog("Silent SA-MP installer did not create samp.dll. Exit code: " +
                              silentInstallerExitCode + "; target: " + gameRoot);

                          _status.Text = "Автоматическая установка не завершилась — открываем мастер SA-MP…";
                          MessageBox.Show(
                              "Фоновая установка SA-MP не создала samp.dll (код " +
                              silentInstallerExitCode + "). Сейчас откроется окно установки. " +
                              "Укажи папку, где находится gta_sa.exe, и заверши установку.",
                              "VEXORIUM — установка мультиплеера",
                              MessageBoxButtons.OK, MessageBoxIcon.Information);

                          var visibleStartInfo = new ProcessStartInfo
                          {
                              FileName = installerPath,
                              WorkingDirectory = Path.GetTempPath(),
                              UseShellExecute = true,
                              WindowStyle = ProcessWindowStyle.Normal
                          };
                          // NSIS requires /D to be the final argument.
                          visibleStartInfo.ArgumentList.Add("/D=" + gameRoot);

                          using var visibleInstallerProcess = Process.Start(visibleStartInfo);
                          if (visibleInstallerProcess == null)
                              throw new Exception("Windows не смог открыть мастер установки SA-MP.");

                          await visibleInstallerProcess.WaitForExitAsync();

                          if (!IsValidSampClientDll(sampDllPath))
                              throw new Exception(
                                  "Установщик SA-MP (код фонового запуска: " + silentInstallerExitCode +
                                  ") завершил работу, но samp.dll не появился рядом с gta_sa.exe. " +
                                  "Папка для проверки: " + gameRoot +
                                  ". Возможная причина — несовместимая версия GTA или выбранная в мастере другая папка.");
                      }

                      WriteLaunchLog("Installed SA-MP 0.3.7 R5-2-MP into " + gameRoot +
                          " (silent installer exit code: " + silentInstallerExitCode + ")");
                  }
                  finally
                  {
                      _progress.Visible = false;
                      try { if (File.Exists(installerPath)) File.Delete(installerPath); } catch { }
                  }
              }

              private async Task EnsureModLoaderAsync()
              {
                  if (!GameInstall.IsGameFolder(_gamePath))
                      throw new Exception("Сначала выбери папку GTA San Andreas.");

                  string gameRoot = _gamePath!;
                  string asiPath = Path.Combine(gameRoot, "modloader.asi");
                  string modFolder = Path.Combine(gameRoot, "modloader");
                  string asiLoaderPath = Path.Combine(gameRoot, "dinput8.dll");
                  Directory.CreateDirectory(modFolder);

                  // Never overwrite an existing ASI loader proxy. It may belong to another installed mod.
                  if (!File.Exists(asiLoaderPath))
                  {
                      _status.Text = "Устанавливаем компонент загрузки модификаций…";
                      string tempZip = Path.Combine(Path.GetTempPath(), "Vexorium-asi-" + Guid.NewGuid().ToString("N") + ".zip");
                      string tempDirectory = Path.Combine(Path.GetTempPath(), "Vexorium-asi-" + Guid.NewGuid().ToString("N"));
                      try
                      {
                          await DownloadArchiveAsync(AsiLoaderArchiveUrl, tempZip, "ASI Loader");
                          Directory.CreateDirectory(tempDirectory);
                          ZipFile.ExtractToDirectory(tempZip, tempDirectory, true);

                          string? dll = Directory.GetFiles(tempDirectory, "dinput8.dll", SearchOption.AllDirectories).FirstOrDefault();
                          if (dll == null)
                              throw new Exception("В архиве ASI Loader не найден 32-битный dinput8.dll.");

                          byte[] signature = new byte[2];
                          using (var stream = File.OpenRead(dll))
                          {
                              if (stream.Read(signature, 0, 2) != 2 || signature[0] != (byte)'M' || signature[1] != (byte)'Z')
                                  throw new Exception("Файл ASI Loader не прошёл проверку Windows DLL.");
                          }
                          if (new FileInfo(dll).Length < 50000)
                              throw new Exception("Файл ASI Loader неожиданно мал; установка отменена.");

                          File.Copy(dll, asiLoaderPath, false);
                          WriteLaunchLog("Installed official 32-bit Ultimate ASI Loader.");
                      }
                      finally
                      {
                          try { if (File.Exists(tempZip)) File.Delete(tempZip); } catch { }
                          try { if (Directory.Exists(tempDirectory)) Directory.Delete(tempDirectory, true); } catch { }
                      }
                  }
                  else
                  {
                      WriteLaunchLog("Existing dinput8.dll detected; kept existing ASI loader proxy unchanged.");
                  }

                  if (!File.Exists(asiPath) || !Directory.Exists(modFolder))
                  {
                      _status.Text = "Загружаем Mod Loader…";
                      string tempZip = Path.Combine(Path.GetTempPath(), "Vexorium-modloader-" + Guid.NewGuid().ToString("N") + ".zip");
                      string tempDirectory = Path.Combine(Path.GetTempPath(), "Vexorium-modloader-" + Guid.NewGuid().ToString("N"));
                      try
                      {
                          await DownloadArchiveAsync(ModLoaderArchiveUrl, tempZip, "Mod Loader");
                          Directory.CreateDirectory(tempDirectory);
                          ZipFile.ExtractToDirectory(tempZip, tempDirectory, true);

                          string? modloaderAsi = Directory.GetFiles(tempDirectory, "modloader.asi", SearchOption.AllDirectories).FirstOrDefault();
                          string? packagedModFolder = Directory.GetDirectories(tempDirectory, "modloader", SearchOption.AllDirectories).FirstOrDefault();
                          if (modloaderAsi == null || packagedModFolder == null)
                              throw new Exception("Архив Mod Loader не содержит modloader.asi и папку modloader.");

                          if (!File.Exists(asiPath))
                              File.Copy(modloaderAsi, asiPath, false);

                          CopyDirectoryWithoutOverwrite(packagedModFolder, modFolder);
                          WriteLaunchLog("Installed Mod Loader v0.3.10.");
                      }
                      finally
                      {
                          try { if (File.Exists(tempZip)) File.Delete(tempZip); } catch { }
                          try { if (Directory.Exists(tempDirectory)) Directory.Delete(tempDirectory, true); } catch { }
                      }
                  }

                  string vexoriumMods = Path.Combine(modFolder, "VEXORIUM");
                  Directory.CreateDirectory(vexoriumMods);
                  foreach (string category in new[] {
                      "Vehicles", "Skins", "Accessories", "Clothing",
                      "Map", "Buildings", "Textures", "Audio"
                  })
                      Directory.CreateDirectory(Path.Combine(vexoriumMods, category));
                  _status.Text = "Mod Loader установлен. Подготавливаем ресурсы VEXORIUM…";
              }

              private async Task DownloadArchiveAsync(string url, string destination, string description)
              {
                  using var client = CreateHttpClient(TimeSpan.FromMinutes(5));
                  using var response = await client.GetAsync(url, HttpCompletionOption.ResponseHeadersRead);
                  response.EnsureSuccessStatusCode();
                  await using (var input = await response.Content.ReadAsStreamAsync())
                  await using (var output = new FileStream(destination, FileMode.Create, FileAccess.Write, FileShare.None))
                      await input.CopyToAsync(output);

                  var info = new FileInfo(destination);
                  if (!info.Exists || info.Length < 10000)
                      throw new Exception("Не удалось скачать архив " + description + " или файл слишком мал.");

                  using var archive = ZipFile.OpenRead(destination);
                  if (archive.Entries.Count == 0)
                      throw new Exception("Архив " + description + " пуст.");
              }

              private static void CopyDirectoryWithoutOverwrite(string source, string destination)
              {
                  Directory.CreateDirectory(destination);
                  foreach (string directory in Directory.GetDirectories(source, "*", SearchOption.AllDirectories))
                  {
                      string relative = Path.GetRelativePath(source, directory);
                      Directory.CreateDirectory(Path.Combine(destination, relative));
                  }

                  foreach (string file in Directory.GetFiles(source, "*", SearchOption.AllDirectories))
                  {
                      string relative = Path.GetRelativePath(source, file);
                      string target = Path.Combine(destination, relative);
                      string? parent = Path.GetDirectoryName(target);
                      if (!string.IsNullOrWhiteSpace(parent))
                          Directory.CreateDirectory(parent);
                      if (!File.Exists(target))
                          File.Copy(file, target, false);
                  }
              }

              private async Task EnsureOpenMpLauncherAsync()
              {
                  Directory.CreateDirectory(OpenMpDirectory);
                  using var client = CreateHttpClient(TimeSpan.FromMinutes(5));

                  string releaseJson = await client.GetStringAsync(OpenMpReleaseApi);
                  using var releaseDoc = JsonDocument.Parse(releaseJson);
                  string tag = releaseDoc.RootElement.GetProperty("tag_name").GetString() ?? "";
                  if (string.IsNullOrWhiteSpace(tag)) throw new Exception("GitHub не сообщил версию open.mp.");

                  string? downloadUrl = null;
                  foreach (JsonElement asset in releaseDoc.RootElement.GetProperty("assets").EnumerateArray())
                  {
                      if (string.Equals(asset.GetProperty("name").GetString(), "omp-launcher.exe", StringComparison.OrdinalIgnoreCase))
                      {
                          downloadUrl = asset.GetProperty("browser_download_url").GetString();
                          break;
                      }
                  }
                  if (!Uri.TryCreate(downloadUrl, UriKind.Absolute, out Uri? assetUri) || assetUri.Host != "github.com")
                      throw new Exception("Не найден официальный файл omp-launcher.exe в GitHub Releases.");

                  string savedTag = "";
                  try { if (File.Exists(OpenMpTagFile)) savedTag = File.ReadAllText(OpenMpTagFile).Trim(); } catch { }
                  if (File.Exists(OpenMpExe) && savedTag == tag) return;

                  _status.Text = "Скачиваем официальный open.mp Launcher " + tag + "…";
                  _progress.Visible = true;
                  _progress.Style = ProgressBarStyle.Continuous;
                  _progress.Value = 0;

                  string tempFile = OpenMpExe + ".download";
                  try { if (File.Exists(tempFile)) File.Delete(tempFile); } catch { }

                  using var response = await client.GetAsync(assetUri, HttpCompletionOption.ResponseHeadersRead);
                  response.EnsureSuccessStatusCode();
                  long? totalBytes = response.Content.Headers.ContentLength;
                  await using (var input = await response.Content.ReadAsStreamAsync())
                  await using (var output = new FileStream(tempFile, FileMode.CreateNew, FileAccess.Write, FileShare.None))
                  {
                      byte[] buffer = new byte[81920];
                      long downloaded = 0;
                      int read;
                      while ((read = await input.ReadAsync(buffer.AsMemory(0, buffer.Length))) > 0)
                      {
                          await output.WriteAsync(buffer.AsMemory(0, read));
                          downloaded += read;
                          if (totalBytes.HasValue && totalBytes.Value > 0)
                          {
                              int percent = (int)Math.Clamp(downloaded * 100L / totalBytes.Value, 0L, 100L);
                              _progress.Value = percent;
                              _status.Text = $"Загрузка open.mp {tag}: {percent}% ({downloaded / 1024 / 1024} МБ)";
                          }
                      }
                  }

                  var info = new FileInfo(tempFile);
                  if (!info.Exists || info.Length < 1_000_000)
                      throw new Exception("Скачанный файл слишком маленький — установка отменена.");

                  byte[] signature = new byte[2];
                  await using (var test = File.OpenRead(tempFile))
                  {
                      if (await test.ReadAsync(signature.AsMemory(0, 2)) != 2 || signature[0] != (byte)'M' || signature[1] != (byte)'Z')
                          throw new Exception("Скачанный файл не распознан как Windows EXE.");
                  }

                  File.Move(tempFile, OpenMpExe, true);
                  File.WriteAllText(OpenMpTagFile, tag);
                  _status.Text = "Клиент open.mp загружен: " + tag;
                  _playButton.Text = "▶  ИГРАТЬ";
              }

              private async Task EnsureOpenMpClientAsync()
              {
                  string ompDirectory = Path.Combine(
                      Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                      "mp.open.launcher", "omp");
                  Directory.CreateDirectory(ompDirectory);

                  string ompClientPath = Path.Combine(ompDirectory, "omp-client.dll");
                  string temporaryPath = ompClientPath + ".download";

                  try
                  {
                      _status.Text = "Проверяем клиент open.mp…";
                      using var client = CreateHttpClient(TimeSpan.FromMinutes(3));
                      string updateJson = await client.GetStringAsync(OpenMpUpdateInfoUrl);
                      using var updateDocument = JsonDocument.Parse(updateJson);
                      JsonElement updateInfo = updateDocument.RootElement;

                      // open.mp launcher 1.7.0 identifies its client resource set as build 7.
                      if (updateInfo.TryGetProperty("versions", out JsonElement versions) &&
                          versions.ValueKind == JsonValueKind.Object &&
                          versions.TryGetProperty("7", out JsonElement buildInfo))
                      {
                          updateInfo = buildInfo;
                      }

                      if (!updateInfo.TryGetProperty("ompPluginDownload", out JsonElement downloadElement) ||
                          !updateInfo.TryGetProperty("ompPluginChecksum", out JsonElement checksumElement))
                          throw new Exception("API open.mp не вернул ссылку и контрольную сумму клиента.");

                      string downloadUrl = downloadElement.GetString() ?? "";
                      string expectedMd5 = checksumElement.GetString() ?? "";
                      if (!Uri.TryCreate(downloadUrl, UriKind.Absolute, out Uri? downloadUri) ||
                          downloadUri.Scheme != Uri.UriSchemeHttps ||
                          string.IsNullOrWhiteSpace(expectedMd5))
                          throw new Exception("API open.mp вернул некорректные данные клиента.");

                      if (File.Exists(ompClientPath) && new FileInfo(ompClientPath).Length > 100000)
                      {
                          string existingMd5;
                          await using (var existingStream = File.OpenRead(ompClientPath))
                          {
                              byte[] hash = await System.Security.Cryptography.MD5.HashDataAsync(existingStream);
                              existingMd5 = Convert.ToHexString(hash);
                          }

                          if (string.Equals(existingMd5, expectedMd5, StringComparison.OrdinalIgnoreCase))
                          {
                              WriteLaunchLog("open.mp client DLL is up to date.");
                              return;
                          }
                      }

                      _status.Text = "Скачиваем компонент open.mp…";
                      _progress.Visible = true;
                      _progress.Style = ProgressBarStyle.Continuous;
                      _progress.Value = 0;
                      try { if (File.Exists(temporaryPath)) File.Delete(temporaryPath); } catch { }

                      using (var response = await client.GetAsync(
                          downloadUri, HttpCompletionOption.ResponseHeadersRead))
                      {
                          response.EnsureSuccessStatusCode();
                          long? totalBytes = response.Content.Headers.ContentLength;

                          await using (var input = await response.Content.ReadAsStreamAsync())
                          await using (var output = new FileStream(
                              temporaryPath, FileMode.CreateNew, FileAccess.Write, FileShare.None))
                          {
                              byte[] buffer = new byte[81920];
                              long downloaded = 0;
                              int read;
                              while ((read = await input.ReadAsync(buffer.AsMemory(0, buffer.Length))) > 0)
                              {
                                  await output.WriteAsync(buffer.AsMemory(0, read));
                                  downloaded += read;

                                  if (totalBytes.HasValue && totalBytes.Value > 0)
                                  {
                                      int percent = (int)Math.Clamp(
                                          downloaded * 100L / totalBytes.Value, 0L, 100L);
                                      _progress.Value = percent;
                                      _status.Text = $"Скачиваем компонент open.mp… {percent}%";
                                  }
                              }
                          }
                      }

                      if (!File.Exists(temporaryPath) || new FileInfo(temporaryPath).Length < 100000)
                          throw new Exception("Компонент open.mp скачан не полностью.");

                      string downloadedMd5;
                      await using (var downloadedStream = File.OpenRead(temporaryPath))
                      {
                          byte[] hash = await System.Security.Cryptography.MD5.HashDataAsync(downloadedStream);
                          downloadedMd5 = Convert.ToHexString(hash);
                      }

                      if (!string.Equals(downloadedMd5, expectedMd5, StringComparison.OrdinalIgnoreCase))
                          throw new Exception("Компонент open.mp не прошёл проверку контрольной суммы.");

                      File.Move(temporaryPath, ompClientPath, true);
                      WriteLaunchLog("Downloaded and verified current open.mp client DLL.");
                  }
                  finally
                  {
                      _progress.Visible = false;
                      try { if (File.Exists(temporaryPath)) File.Delete(temporaryPath); } catch { }
                  }
              }

              private async Task UpdateLauncherAsync()
              {
                  if (_busy) return;
                  _busy = true;
                  _updateButton.Enabled = false;
                  _status.Text = "Скачиваем обновление VEXORIUM…";

                  string currentExe = Application.ExecutablePath;
                  string tempExe = Path.Combine(Path.GetTempPath(), "Vexorium-" + Guid.NewGuid().ToString("N") + ".exe");
                  string script = Path.Combine(Path.GetTempPath(), "VexoriumUpdate-" + Guid.NewGuid().ToString("N") + ".ps1");
                  try
                  {
                      using var client = CreateHttpClient(TimeSpan.FromMinutes(5));
                      using var response = await client.GetAsync(LauncherDownloadUrl, HttpCompletionOption.ResponseHeadersRead);
                      response.EnsureSuccessStatusCode();
                      await using (var input = await response.Content.ReadAsStreamAsync())
                      await using (var output = File.Create(tempExe))
                          await input.CopyToAsync(output);

                      if (!File.Exists(tempExe) || new FileInfo(tempExe).Length < 1_000_000)
                          throw new Exception("Скачанный файл слишком маленький.");

                      byte[] signature = new byte[2];
                      await using (var test = File.OpenRead(tempExe))
                      {
                          if (await test.ReadAsync(signature.AsMemory(0, 2)) != 2 || signature[0] != (byte)'M' || signature[1] != (byte)'Z')
                              throw new Exception("Скачанный файл не распознан как Windows EXE.");
                      }

                      int pid = Environment.ProcessId;
                      string ps = "$pidToWait = " + pid + "\r\n" +
                          "$download = " + PsQuote(tempExe) + "\r\n" +
                          "$target = " + PsQuote(currentExe) + "\r\n" +
                          "while (Get-Process -Id $pidToWait -ErrorAction SilentlyContinue) { Start-Sleep -Milliseconds 500 }\r\n" +
                          "try { Copy-Item -LiteralPath $download -Destination $target -Force -ErrorAction Stop; Remove-Item -LiteralPath $download -Force -ErrorAction SilentlyContinue; Start-Process -FilePath $target } catch { Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.MessageBox]::Show('Не удалось заменить файл. Перемести лаунчер в папку, доступную для записи.', 'VEXORIUM — ошибка обновления') | Out-Null }\r\n" +
                          "Remove-Item -LiteralPath $MyInvocation.MyCommand.Path -Force -ErrorAction SilentlyContinue\r\n";

                      await File.WriteAllTextAsync(script, ps, Encoding.UTF8);
                      Process.Start(new ProcessStartInfo
                      {
                          FileName = "powershell.exe",
                          Arguments = "-NoProfile -ExecutionPolicy Bypass -File \"" + script + "\"",
                          UseShellExecute = false,
                          CreateNoWindow = true,
                          WindowStyle = ProcessWindowStyle.Hidden
                      });
                      MessageBox.Show("Обновление скачано. Лаунчер закроется и запустится снова.", "VEXORIUM",
                          MessageBoxButtons.OK, MessageBoxIcon.Information);
                      Close();
                  }
                  catch (Exception ex)
                  {
                      try { if (File.Exists(tempExe)) File.Delete(tempExe); } catch { }
                      _status.ForeColor = Color.FromArgb(255, 145, 145);
                      _status.Text = "Не удалось скачать обновление.";
                      _updateButton.Enabled = true;
                      MessageBox.Show("Не удалось обновить лаунчер:\n" + ex.Message, "Ошибка обновления",
                          MessageBoxButtons.OK, MessageBoxIcon.Error);
                  }
                  finally
                  {
                      _busy = false;
                      RefreshButtons();
                  }
              }

              private static string PsQuote(string value) => "'" + value.Replace("'", "''") + "'";

          }
          '@

          $sourceContent = $sourceContent.Replace('__LAUNCHER_VERSION__', $env:LAUNCHER_VERSION)
          Set-Content -Encoding utf8 -Path .\src\Program.cs -Value $sourceContent

      - name: Publish Windows launcher
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(12,13,18))
          $bg = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
            (New-Object System.Drawing.Rectangle(0,0,256,256)),
            [System.Drawing.Color]::FromArgb(48,18,27),
            [System.Drawing.Color]::FromArgb(10,11,16),
            45)
          $g.FillRectangle($bg,0,0,256,256)
          $ring = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(226,39,54),9)
          $g.DrawEllipse($ring,13,13,230,230)
          $inner = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(90,210,210,220),2)
          $g.DrawEllipse($inner,27,27,202,202)
          $points = [System.Drawing.Point[]]@(
            (New-Object System.Drawing.Point 67,65),
            (New-Object System.Drawing.Point 111,65),
            (New-Object System.Drawing.Point 139,139),
            (New-Object System.Drawing.Point 168,65),
            (New-Object System.Drawing.Point 207,65),
            (New-Object System.Drawing.Point 151,193),
            (New-Object System.Drawing.Point 127,211),
            (New-Object System.Drawing.Point 104,193))
          $silver = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(235,237,242))
          $g.FillPolygon($silver,$points)
          $redBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(226,39,54))
          $cut = [System.Drawing.Point[]]@(
            (New-Object System.Drawing.Point 128,128),
            (New-Object System.Drawing.Point 148,178),
            (New-Object System.Drawing.Point 128,193),
            (New-Object System.Drawing.Point 108,178))
          $g.FillPolygon($redBrush,$cut)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $stream = [System.IO.File]::Create(".\src\vexorium.ico")
          $icon.Save($stream)
          $stream.Dispose(); $icon.Dispose(); $silver.Dispose(); $redBrush.Dispose()
          $inner.Dispose(); $ring.Dispose(); $bg.Dispose(); $g.Dispose(); $bmp.Dispose()

          dotnet publish .\src\VexoriumLauncher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\PLAYER_BUILD

          if (!(Test-Path .\PLAYER_BUILD\VexoriumLauncher.exe)) {
            throw 'VexoriumLauncher.exe was not created.'
          }

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: VexoriumLauncher-Windows-x64
          path: PLAYER_BUILD/VexoriumLauncher.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: VEXORIUM Launcher ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: PLAYER_BUILD/VexoriumLauncher.exe
          fail_on_unmatched_files: true