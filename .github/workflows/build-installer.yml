name: Build VEXORIUM Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read launcher version
        id: version
        shell: pwsh
        run: |
          $v = Get-Content .\version.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($v.version)) { throw 'version.json has no version.' }
          if ($v.version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw 'Invalid version in version.json.' }
          "version=$($v.version)" >> $env:GITHUB_OUTPUT

      - name: Create launcher source
        shell: pwsh
        env:
          LAUNCHER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path .\src | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <AssemblyName>VexoriumLauncher</AssemblyName>
            <ApplicationIcon>vexorium.ico</ApplicationIcon>
              <RootNamespace>VexoriumLauncher</RootNamespace>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 .\src\VexoriumLauncher.csproj

          $sourceContent = @'
          using System;
          using System.Diagnostics;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.IO;
          using System.IO.Compression;
          using System.Linq;
          using System.Net.Http;
          using System.Text;
          using System.Text.Json;
          using System.Threading.Tasks;
          using System.Windows.Forms;

          namespace VexoriumLauncher;

          internal static class Program
          {
              [STAThread]
              private static void Main()
              {
                  ApplicationConfiguration.Initialize();
                  Application.Run(new LauncherForm(GameInstall.FindSavedPath()));
              }
          }

          internal static class GameInstall
          {
              private static readonly string ConfigDirectory = Path.Combine(
                  Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "Vexorium");
              private static readonly string GamePathFile = Path.Combine(ConfigDirectory, "game-path.txt");
              private static readonly string NicknameFile = Path.Combine(ConfigDirectory, "nickname.txt");

              public static bool IsGameFolder(string? path) =>
                  !string.IsNullOrWhiteSpace(path) && File.Exists(Path.Combine(path, "gta_sa.exe"));

              public static string? FindSavedPath()
              {
                  try
                  {
                      if (File.Exists(GamePathFile))
                      {
                          string saved = File.ReadAllText(GamePathFile).Trim();
                          if (IsGameFolder(saved)) return saved;
                      }
                  }
                  catch { }
                  return null;
              }

              public static string ReadNickname()
              {
                  try
                  {
                      if (File.Exists(NicknameFile))
                      {
                          string name = File.ReadAllText(NicknameFile).Trim();
                          if (!string.IsNullOrWhiteSpace(name)) return name;
                      }
                  }
                  catch { }
                  return "Vexor_Player";
              }

              public static void SaveNickname(string nickname)
              {
                  try
                  {
                      Directory.CreateDirectory(ConfigDirectory);
                      File.WriteAllText(NicknameFile, nickname);
                  }
                  catch { }
              }

              public static string? PickGameFolder()
              {
                  using var dialog = new FolderBrowserDialog
                  {
                      Description = "Выберите папку, в которой находится gta_sa.exe",
                      UseDescriptionForTitle = true,
                      ShowNewFolderButton = false
                  };

                  if (dialog.ShowDialog() != DialogResult.OK) return null;
                  if (!IsGameFolder(dialog.SelectedPath))
                  {
                      MessageBox.Show("В выбранной папке не найден gta_sa.exe. Выберите именно папку GTA San Andreas.",
                          "Папка GTA не найдена", MessageBoxButtons.OK, MessageBoxIcon.Warning);
                      return null;
                  }

                  try
                  {
                      Directory.CreateDirectory(ConfigDirectory);
                      File.WriteAllText(GamePathFile, dialog.SelectedPath);
                  }
                  catch { }
                  return dialog.SelectedPath;
              }
          }

          internal sealed class RoundedButton : Button
          {
              private bool _hovered;
              public Color HoverColor { get; set; } = Color.FromArgb(61, 63, 77);
              public int CornerRadius { get; set; } = 14;

              public RoundedButton()
              {
                  FlatStyle = FlatStyle.Flat;
                  FlatAppearance.BorderSize = 0;
                  UseVisualStyleBackColor = false;
                  Cursor = Cursors.Hand;
                  SetStyle(ControlStyles.UserPaint | ControlStyles.AllPaintingInWmPaint |
                      ControlStyles.OptimizedDoubleBuffer | ControlStyles.ResizeRedraw, true);
              }

              protected override void OnMouseEnter(EventArgs e)
              {
                  _hovered = true;
                  Invalidate();
                  base.OnMouseEnter(e);
              }

              protected override void OnMouseLeave(EventArgs e)
              {
                  _hovered = false;
                  Invalidate();
                  base.OnMouseLeave(e);
              }

              protected override void OnEnabledChanged(EventArgs e)
              {
                  Invalidate();
                  base.OnEnabledChanged(e);
              }

              protected override void OnPaintBackground(PaintEventArgs e)
              {
                  e.Graphics.Clear(Parent?.BackColor ?? Color.FromArgb(15, 16, 21));
              }

              protected override void OnPaint(PaintEventArgs e)
              {
                  e.Graphics.SmoothingMode = SmoothingMode.AntiAlias;
                  Rectangle rect = ClientRectangle;
                  rect.Width -= 1;
                  rect.Height -= 1;
                  if (rect.Width < 2 || rect.Height < 2) return;

                  Color fill = !Enabled ? Color.FromArgb(39, 40, 47) : (_hovered ? HoverColor : BackColor);
                  using var path = CreateRoundedPath(rect, CornerRadius);
                  using var brush = new SolidBrush(fill);
                  e.Graphics.FillPath(brush, path);

                  if (Enabled && _hovered)
                  {
                      using var pen = new Pen(Color.FromArgb(90, 255, 255, 255), 1);
                      e.Graphics.DrawPath(pen, path);
                  }

                  TextRenderer.DrawText(e.Graphics, Text, Font, Rectangle.Inflate(rect, -8, -2),
                      Enabled ? ForeColor : Color.FromArgb(115, 117, 128),
                      TextFormatFlags.HorizontalCenter | TextFormatFlags.VerticalCenter |
                      TextFormatFlags.EndEllipsis | TextFormatFlags.NoPadding);
              }

              private static GraphicsPath CreateRoundedPath(Rectangle r, int radius)
              {
                  int d = Math.Min(radius * 2, Math.Min(r.Width, r.Height));
                  var path = new GraphicsPath();
                  path.AddArc(r.X, r.Y, d, d, 180, 90);
                  path.AddArc(r.Right - d, r.Y, d, d, 270, 90);
                  path.AddArc(r.Right - d, r.Bottom - d, d, d, 0, 90);
                  path.AddArc(r.X, r.Bottom - d, d, d, 90, 90);
                  path.CloseFigure();
                  return path;
              }
          }

