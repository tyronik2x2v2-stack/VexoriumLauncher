              private static GraphicsPath CreateRoundRect(Rectangle r, int radius)
              {
                  int d = Math.Min(radius * 2, Math.Min(r.Width, r.Height));
                  var p = new GraphicsPath();
                  p.AddArc(r.X, r.Y, d, d, 180, 90); p.AddArc(r.Right - d, r.Y, d, d, 270, 90);
